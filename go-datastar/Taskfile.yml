# https://taskfile.dev

version: "3"

interval: 100ms

tasks:
  tools:
    cmds:
      - go install github.com/sqlc-dev/sqlc/cmd/sqlc@latest
      - go install github.com/delaneyj/toolbelt/sqlc-gen-zombiezen@latest
      - go install github.com/a-h/templ/cmd/templ@latest
      - go install golang.org/x/tools/cmd/goimports@latest

  css:
    dir: web
    sources:
      - "**/*.templ"
      - "**/*.md"
      - "**/*.go"
    generates:
      - "static/css/site.css"
    cmds:
      - npx tailwindcss@3 -i gen/css/site.css -o static/site.css

  sqlc:
    dir: sql
    sources:
      - "**/*.sql"
    cmds:
      - sqlc generate
      - goimports -w .

  templ:
    env:
      TEMPL_EXPERIMENT: rawgo
    generates:
      - "**/*_templ.go"
    sources:
      - "**/*.templ"
    cmds:
      - templ generate .

  site:
    method: none
    desc: build and run site
    sources:
      - code/go/**/*.templ
      - code/go/**/*.go
      - code/go/site/static/**/*
    generates:
      - ./website_bin
    deps:
      - templ
      - sqlc
      - css

    cmds:
      - go mod tidy
      - go build -o ./website_bin cmd/site/main.go
      - ./website_bin

  upx:
    cmds:
      - go build -ldflags="-s -w" -o website_bin cmd/site/main.go
      - upx -9 website_bin

  kill:
    method: none
    cmds:
      - fuser -k 4321/tcp > /dev/null 2>&1 || true

  docker:
    desc: Build Docker image
    cmds:
      - docker build --network host -t go-datastar-app .

  docker-local:
    desc: Build Docker image from local binary
    deps:
      - upx
    cmds:
      - docker build -f Dockerfile.local -t go-datastar-app .

  fly-setup:
    desc: Setup Fly.io app (first time only)
    cmds:
      - fly launch --no-deploy
      - echo "Creating volume for SQLite database..."
      - fly volumes create pokemon_data --size 1 --yes
      - echo "Setup complete! Run 'task fly-deploy' to deploy"

  fly-deploy:
    desc: Deploy to Fly.io
    cmds:
      - fly deploy --build-arg NETWORK=host

  default:
    deps:
      - site
    silent: true
